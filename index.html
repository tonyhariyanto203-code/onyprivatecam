<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera Web Pro to Drive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 15px;
      background-color: #f4f4f9;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
      cursor: pointer;
    }
    video {
      width: 100%;
      display: block;
    }
    /* Indicator Tap to Focus */
    .focus-ring {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid #ffeb3b;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      color: white;
      transition: 0.2s;
    }
    #capture-btn { background-color: #28a745; }
    #switch-btn { background-color: #007bff; }
    #torch-btn { background-color: #ff9800; }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Kamera Web Pro to Drive</h2>

  <div class="video-container" id="video-box">
    <video id="webcam" autoplay playsinline></video>
    <!-- Efek visual saat layar di-tap -->
    <div id="focus-ring" class="focus-ring"></div>
  </div>

  <div class="button-group">
    <button id="switch-btn">🔄 Ganti Kamera</button>
    <button id="torch-btn">🔦 Senter: OFF</button>
    <button id="capture-btn">📷 Ambil & Upload Foto</button>
  </div>

  <p id="status"></p>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw9ICQDUp25ZMhZLXtWdQgQfI5AOLYthKLTjqcsPpANMcytoFvtL0CDRkNytHhFKbqn6g/exec";

    const video = document.getElementById('webcam');
    const videoBox = document.getElementById('video-box');
    const focusRing = document.getElementById('focus-ring');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const switchBtn = document.getElementById('switch-btn');
    const torchBtn = document.getElementById('torch-btn');
    const statusText = document.getElementById('status');

    let currentStream = null;
    let currentFacingMode = 'environment'; // Default kamera belakang
    let isTorchOn = false;

    function stopCurrentStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
    }

    // 1. Jalankan Kamera dengan Resolusi Maksimal & Fitur Hardware
    async function startCamera(facingMode) {
      stopCurrentStream();
      isTorchOn = false;
      torchBtn.innerText = "🔦 Senter: OFF";
      statusText.innerText = "Membuka kamera HD...";
      statusText.style.color = "#333";

      // 1. Minta Resolusi Maksimal (Ideal 4K / Full HD)
      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 3840, max: 3840 },
          height: { ideal: 2160, max: 2160 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        // Tunggu video ready untuk cek dukungan Senter & Fokus
        video.onloadedmetadata = () => {
          checkCapabilities();
          statusText.innerText = "";
        };
      } catch (err) {
        statusText.innerText = "Gagal buka kamera: " + err.message;
        statusText.style.color = "red";
      }
    }

    // Cek kemampuan kamera (Torch / Focus)
    function checkCapabilities() {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      // Cek dukungan Senter
      if (capabilities.torch) {
        torchBtn.style.display = "inline-block";
      } else {
        torchBtn.style.display = "none"; // Sembunyikan jika kamera tidak punya senter (misal kamera depan)
      }

      // Aktifkan Auto Focus bawaan jika didukung
      if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        track.applyConstraints({
          advanced: [{ focusMode: 'continuous' }]
        }).catch(() => {});
      }
    }

    // 2. Fitur Senter / Flash Toggle
    torchBtn.addEventListener('click', async () => {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      
      try {
        isTorchOn = !isTorchOn;
        await track.applyConstraints({
          advanced: [{ torch: isTorchOn }]
        });
        torchBtn.innerText = isTorchOn ? "🔦 Senter: ON" : "🔦 Senter: OFF";
      } catch (err) {
        alert("Senter tidak didukung pada kamera ini.");
      }
    });

    // 3. Fitur Tap to Focus (Klik area video untuk fokus)
    videoBox.addEventListener('click', async (e) => {
      if (!currentStream) return;

      // Efek visual lingkaran kuning pas di-tap
      const rect = videoBox.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 800);

      // Trigger re-focus hardware
      const track = currentStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (capabilities.focusMode) {
        try {
          // Paksa fokus ulang (single-shot lalu kembalikan ke continuous)
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          setTimeout(() => {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
          }, 1000);
        } catch (err) {
          console.log("Tap to focus tidak didukung penuh oleh browser HP ini.");
        }
      }
    });

    // 4. Switch Kamera (Depan <-> Belakang)
    switchBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera(currentFacingMode);
    });

    // 5. Ambil Foto & Upload ke Drive
    captureBtn.addEventListener('click', async () => {
      captureBtn.disabled = true;
      switchBtn.disabled = true;
      torchBtn.disabled = true;
      statusText.innerText = "Mengunggah foto resolusi tinggi ke Drive...";
      statusText.style.color = "#0056b3";

      // Tangkap resolusi asli video stream
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = canvas.toDataURL('image/png');

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({ image: imageData })
        });

        const result = await response.json();

        if (result.status === "success") {
          statusText.innerText = `Foto (${canvas.width}x${canvas.height}px) berhasil masuk ke Drive!`;
          statusText.style.color = "green";
        } else {
          statusText.innerText = "Gagal upload: " + result.message;
          statusText.style.color = "red";
        }
      } catch (err) {
        statusText.innerText = "Terjadi kesalahan: " + err.message;
        statusText.style.color = "red";
      } finally {
        captureBtn.disabled = false;
        switchBtn.disabled = false;
        torchBtn.disabled = false;
      }
    });

    // Buka kamera belakang dengan resolusi maksimal saat pertama kali dimuat
    startCamera(currentFacingMode);
  </script>

</body>
</html>
