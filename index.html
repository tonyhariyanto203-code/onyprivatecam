<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera Web Ke Google Drive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 15px;
      background-color: #f4f4f9;
    }
    .mode-container {
      margin-bottom: 5px;
    }
    #toggle-mode-btn {
      background-color: #6f42c1;
      color: white;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      cursor: pointer;
    }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      display: block;
    }
    /* Animasi lingkaran fokus untuk Versi 2 */
    .focus-ring {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid #ffeb3b;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      pointer-events: none;
    }
    .focus-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      color: white;
      transition: 0.2s;
    }
    #capture-btn { background-color: #28a745; }
    #switch-btn { background-color: #007bff; }
    #torch-btn { background-color: #ffc107; color: #333; }
    button:disabled {
      background-color: #6c757d;
      color: white;
      cursor: not-allowed;
    }

    /* === STYLES PROGRESS BAR INLINE (TANPA OVERLAY) === */
    .upload-progress-box {
      width: 100%;
      max-width: 320px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #28a745, #20c997);
      border-radius: 10px;
      transition: width 0.15s ease-in-out;
    }
    .percent-text {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    #status {
      margin-top: 5px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Kamera Web to Drive</h2>

  <!-- Tombol Beralih Mode Versi -->
  <div class="mode-container">
    <button id="toggle-mode-btn">⚙️ Mode: Versi 2 (Lengkap)</button>
  </div>

  <div class="video-container" id="video-wrapper">
    <video id="webcam" autoplay playsinline></video>
    <div id="focus-ring" class="focus-ring"></div>
  </div>

  <div class="button-group">
    <button id="switch-btn">🔄 Ganti Kamera</button>
    <button id="torch-btn">🔦 Senter: OFF</button>
    <button id="capture-btn">📷 Ambil & Upload Foto</button>
  </div>

  <!-- CONTAINER PERSENTASE LANGSUNG DI BAWAH TOMBOL -->
  <div id="progress-box" class="upload-progress-box">
    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
    <span id="percent-text" class="percent-text">0%</span>
  </div>

  <p id="status"></p>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw9ICQDUp25ZMhZLXtWdQgQfI5AOLYthKLTjqcsPpANMcytoFvtL0CDRkNytHhFKbqn6g/exec";

    const video = document.getElementById('webcam');
    const videoWrapper = document.getElementById('video-wrapper');
    const focusRing = document.getElementById('focus-ring');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const switchBtn = document.getElementById('switch-btn');
    const torchBtn = document.getElementById('torch-btn');
    const toggleModeBtn = document.getElementById('toggle-mode-btn');
    const statusText = document.getElementById('status');

    // Elemen Progress Bar Inline
    const progressBox = document.getElementById('progress-box');
    const progressFill = document.getElementById('progress-fill');
    const percentText = document.getElementById('percent-text');

    let currentStream = null;
    let isVersion2 = true; // Default Versi 2
    let currentFacingMode = 'environment'; // Kamera belakang default di awal
    let isTorchOn = false;

    function stopCurrentStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
    }

    // Jalankan Kamera
    async function startCamera() {
      stopCurrentStream();
      isTorchOn = false;
      torchBtn.innerText = "🔦 Senter: OFF";
      statusText.innerText = "Membuka kamera...";
      statusText.style.color = "#333";

      try {
        let videoConstraints = isVersion2 ? {
          facingMode: currentFacingMode,
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        } : { facingMode: currentFacingMode };

        currentStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: false
        });

        video.srcObject = currentStream;
        statusText.innerText = "";
      } catch (err) {
        statusText.innerText = "Gagal buka kamera: " + err.message;
        statusText.style.color = "red";
      }
    }

    // Toggle Antara Versi 1 dan Versi 2
    toggleModeBtn.addEventListener('click', () => {
      isVersion2 = !isVersion2;
      currentFacingMode = 'environment'; // Reset selalu balik ke kamera belakang dulu

      if (isVersion2) {
        toggleModeBtn.innerText = "⚙️ Mode: Versi 2 (Lengkap)";
        switchBtn.style.display = "inline-block";
        torchBtn.style.display = "inline-block";
      } else {
        toggleModeBtn.innerText = "⚙️ Mode: Versi 1 (Simple)";
        switchBtn.style.display = "inline-block"; // Versi 1 ada tombol switch kamera juga
        torchBtn.style.display = "none";
      }

      startCamera();
    });

    // Fitur Switch Kamera (Berlaku untuk Versi 1 & Versi 2)
    switchBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera();
    });

    // Fitur Senter (Hanya Versi 2)
    torchBtn.addEventListener('click', async () => {
      if (!currentStream || !isVersion2) return;
      const track = currentStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (!capabilities.torch) {
        alert("Senter/Flash tidak didukung di kamera ini.");
        return;
      }

      try {
        isTorchOn = !isTorchOn;
        await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        torchBtn.innerText = isTorchOn ? "🔦 Senter: ON" : "🔦 Senter: OFF";
      } catch (err) {
        alert("Gagal mengontrol senter: " + err.message);
      }
    });

    // Fitur Tap to Focus (Hanya Versi 2)
    videoWrapper.addEventListener('click', async (e) => {
      if (!currentStream || !isVersion2) return;

      const rect = videoWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');

      setTimeout(() => focusRing.classList.remove('active'), 800);

      const track = currentStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
        try {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        } catch (err) {
          console.log("Fokus manual tidak didukung:", err);
        }
      }
    });

    // Upload Foto ke Drive + Progress Persentase Inline
    captureBtn.addEventListener('click', async () => {
      captureBtn.disabled = true;
      switchBtn.disabled = true;
      torchBtn.disabled = true;

      // Reset progress bar & tampilkan di bawah tombol
      progressFill.style.width = '10%';
      percentText.innerText = 'Uploading 10%';
      progressBox.style.display = 'flex';
      statusText.innerText = "";

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = canvas.toDataURL('image/png');
      const payload = JSON.stringify({ image: imageData });

      try {
        // Animasi persentase halus saat mengirim
        let fakePercent = 10;
        const progressInterval = setInterval(() => {
          if (fakePercent < 90) {
            fakePercent += 10;
            progressFill.style.width = fakePercent + '%';
            percentText.innerText = `Uploading ${fakePercent}%`;
          }
        }, 150);

        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        });

        clearInterval(progressInterval);
        progressFill.style.width = '100%';
        percentText.innerText = 'Upload 100%';

        setTimeout(() => {
          progressBox.style.display = 'none';
          statusText.innerText = "Foto berhasil masuk ke Drive!";
          statusText.style.color = "green";
        }, 500);

      } catch (err) {
        progressBox.style.display = 'none';
        statusText.innerText = "Gagal upload: " + err.message;
        statusText.style.color = "red";
      } finally {
        captureBtn.disabled = false;
        switchBtn.disabled = false;
        torchBtn.disabled = false;
      }
    });

    // Jalankan Kamera Pertama Kali (Kamera Belakang Default)
    startCamera();
  </script>

</body>
</html>
